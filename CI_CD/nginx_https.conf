# ==============================================================================
# Nginx 설정: Dev / Op 환경 HTTPS 강제 적용 설정 (포트 80 -> 443 리다이렉트)
# ==============================================================================
# 적용 경로: /etc/nginx/conf.d/travel.conf 또는 /etc/nginx/sites-available/default
# ==============================================================================

# 1. HTTP (Port 80) -> HTTPS (Port 443) 무조건 301 강제 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name _; # 실제 도메인 또는 EC2 퍼블릭 IP/도메인으로 변경 가능

    # Let's Encrypt 인증서 갱신 경로 예외 허용
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (Port 443) 서버 블록
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 인증서 경로 (Let's Encrypt 기준 예시)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 보안 프로토콜 및 암호화 스위트
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 보안 헤더 (HSTS 강제)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 프론트엔드 React(Vite) 빌드 정적 파일 서빙
    root /usr/share/nginx/html;
    index index.html;

    # SPA 클라이언트 사이드 라우팅 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 NestJS API 리버스 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:3001; # 내부 백엔드 포트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 백엔드에 HTTPS 통신임을 전달하는 핵심 헤더
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
