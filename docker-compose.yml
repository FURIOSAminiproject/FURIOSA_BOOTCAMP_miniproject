# ==============================================================================
# Docker Compose: 환경별(local, dev, op/production) 통합 오케스트레이션
# ==============================================================================
# 실행 예시:
#   - 운영(OP):   APP_ENV=production docker compose up -d --build  (기본값)
#   - 개발(DEV):  APP_ENV=development docker compose up -d --build
#   - 로컬(LOCAL): APP_ENV=local docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. NestJS 백엔드 서비스
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: travel-backend
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - PORT=3001
      - HOST=0.0.0.0
    # 선택된 환경(APP_ENV)에 맞는 .env 파일 자동 로드 (.env.production / .env.development / .env.local)
    env_file:
      - path: ./BackEnd/.env.${APP_ENV:-production}
        required: false
    # 호스트 OS(EC2)에서 구동 중인 PostgreSQL 접속 지원
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - travel-network

  # ----------------------------------------------------------------------------
  # 2. React + Nginx 프론트엔드 및 리버스 프록시 서비스
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: travel-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge
