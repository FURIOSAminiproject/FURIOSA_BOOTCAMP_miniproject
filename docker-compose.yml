# ==============================================================================
# Docker Compose: 환경별(local, dev, op/production) 통합 오케스트레이션
# ==============================================================================
# 실행 예시:
#   - 운영(OP):   APP_ENV=production docker compose up -d --build  (기본값)
#   - 개발(DEV):  APP_ENV=development docker compose up -d --build
#   - 로컬(LOCAL): APP_ENV=local docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. NestJS 백엔드 서비스 (BFF & 비즈니스 로직)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./BackEnd/nestjs
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: travel-backend
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - PORT=3001
      - HOST=0.0.0.0
    # 선택된 환경(APP_ENV)에 맞는 .env 파일 자동 로드 (.env.production / .env.development / .env.local)
    env_file:
      - path: ./BackEnd/nestjs/.env.${APP_ENV:-production}
        required: false
    # 호스트 OS(EC2)에서 구동 중인 PostgreSQL 접속 지원
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - travel-network

  # ----------------------------------------------------------------------------
  # 2. FastAPI AI 추론 엔진 서비스 (고성능 AI 연산 & NPU 서빙)
  # ----------------------------------------------------------------------------
  fastapi:
    build:
      context: ./BackEnd/fastapi
      dockerfile: Dockerfile
    container_name: travel-fastapi
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=8000
    env_file:
      - path: ./BackEnd/fastapi/.env
        required: false
    networks:
      - travel-network

  # ----------------------------------------------------------------------------
  # 3. React + Nginx 프론트엔드 및 리버스 프록시 서비스
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: travel-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 호스트 EC2에 위치한 Let's Encrypt SSL 인증서 볼륨 마운트 (읽기 전용)
      - ${SSL_CERT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
      # 호스트 EC2의 Certbot HTTP-01 갱신 챌린지 경로
      - ${CERTBOT_WWW_PATH:-/var/www/certbot}:/var/www/certbot:ro
    depends_on:
      - backend
      - fastapi
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge
