# ==============================================================================
# 기본 Nginx 설정 (HTTP Port 80 서빙 및 API 리버스 프록시)
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Docker 내부 DNS 리졸버 (도커 컨테이너 서비스 이름 동적 해석)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # React 정적 빌드 파일 서빙 디렉토리
    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt HTTP-01 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # SPA 라우팅 지원 (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 NestJS 컨테이너로 API 요청 리버스 프록시
    location /api/ {
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # FastAPI AI 추론 엔진 컨테이너로 API 요청 리버스 프록시
    location /fastapi/ {
        set $fastapi_upstream "http://fastapi:8000";
        rewrite ^/fastapi/(.*) /$1 break;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # 정적 에셋 캐싱
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
