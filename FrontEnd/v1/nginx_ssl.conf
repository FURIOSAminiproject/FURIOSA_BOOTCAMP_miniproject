# ==============================================================================
# Nginx HTTPS (Port 443 + Port 80 Redirect) 설정: 운영(EC2) SSL 프로덕션 환경
# ==============================================================================

# 1. HTTP 요청을 HTTPS로 301 리다이렉트 (Let's Encrypt 갱신 챌린지 경로 제외)
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 갱신 챌린지 경로 (호스트 EC2의 certbot webroot와 연동)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 그 외 모든 일반 웹 트래픽은 HTTPS로 안전하게 영구 이동
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 보안 웹 서버 (Port 443)
server {
    listen 443 ssl;
    server_name _;

    # Docker 내부 DNS 리졸버 (도커 컨테이너 서비스 이름 동적 해석)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 호스트 EC2(/etc/letsencrypt)에서 볼륨 마운트된 SSL 인증서 경로
    ssl_certificate __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    # SSL 보안 프로토콜 및 최신 암호화 스위트 (TLS 1.2, 1.3 권장)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 보안 강화 헤더 (HSTS, Clickjacking 방지, MIME 스니핑 방지)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # React SPA 정적 번들 서빙
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 지원 (HTML5 History API 새로고침 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 캐시 방지 (배포 즉시 항상 최신 JS 번들 로드 보장)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 백엔드 NestJS 컨테이너로 API 요청 리버스 프록시
    location /api/ {
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # 로그인 및 OAuth 콜백의 /auth 경로와 쿠키 경로를 그대로 전달
    location /auth/ {
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # FastAPI AI 추론 엔진 컨테이너로 API 요청 리버스 프록시
    location /fastapi/ {
        set $fastapi_upstream "http://fastapi:8000";
        rewrite ^/fastapi/(.*) /$1 break;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # 정적 에셋 브라우저 캐싱 (6개월)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
