# 기존 Compose와 함께 사용한다. CI_CD/BackEnd/ors/{build,deploy}.sh가 경로를 준비한다.
services:
  ors:
    # 공식 v10.0.1 멀티아키텍처 이미지. CI와 운영이 같은 digest를 사용한다.
    image: openrouteservice/openrouteservice:v10.0.1@sha256:b2f66b5e33949e86a279f3de654ef99e2964eb9112d16fb52788c6bb63ff941c
    profiles: [ors]
    # DB 공유 서버 장애 후 재부팅/OOM 반복으로 무거운 그래프 생성이 재시작되지 않게 한다.
    # 운영자가 자원을 확보한 뒤 전용 배포 스크립트로 명시적으로 시작한다.
    restart: "no"
    ports:
      - "127.0.0.1:${ORS_HTTP_PORT:-8082}:8082"
    environment:
      ORS_CONFIG_LOCATION: /etc/ors/roadfriend.yml
      REBUILD_GRAPHS: "false"
      CONTAINER_LOG_LEVEL: INFO
      XMS: ${ORS_JVM_XMS:-256m}
      XMX: ${ORS_JVM_XMX:-2g}
    mem_limit: ${ORS_MEMORY_LIMIT:-3g}
    # RAM 한도와 memory+swap 한도를 같게 두어 ORS가 호스트 swap을 압박하지 않게 한다.
    memswap_limit: ${ORS_MEMORY_LIMIT:-3g}
    cpus: ${ORS_CPUS:-0.5}
    volumes:
      - type: bind
        source: ${ORS_CONFIG_FILE:-./Docker/ors/ors-config.yml}
        target: /etc/ors/roadfriend.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORS_OSM_FILE:-./.ors-unprepared/input.osm.pbf}
        target: /data/osm/input.osm.pbf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORS_GRAPHS_DIR:-./.ors-unprepared/graphs}
        target: /home/ors/graphs
        bind:
          create_host_path: false
      - ors-logs:/home/ors/logs
    healthcheck:
      test: [CMD-SHELL, 'wget -q -T 5 -O - http://127.0.0.1:8082/ors/v2/health | grep -Eq ''"status"[[:space:]]*:[[:space:]]*"ready"''']
      start_period: 30m
      interval: 15s
      timeout: 6s
      retries: 4
    networks:
      - travel-network

volumes:
  ors-logs:
