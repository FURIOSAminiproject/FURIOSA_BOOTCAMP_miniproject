# ==============================================================================
# GitHub Actions 워크플로우: Nest.js 백엔드 EC2 자동 배포 파이프라인
# ==============================================================================
# 동작 구조:
#   1. build 잡: GitHub 호스팅 러너(ubuntu-latest)에서 테스트 및 빌드 수행 후 아티팩트 업로드
#   2. deploy 잡: EC2 Self-hosted 러너에서 아티팩트 다운로드, 의존성 설치, PM2 무중단 재기동
# ==============================================================================

name: Deploy NestJS to EC2

# 워크플로우 트리거 조건 정의
on:
  # main 브랜치로 push 발생 시 자동 실행
  push:
    branches:
      - main
    # 백엔드 소스, 배포 스크립트, 워크플로우 파일 변경 시에만 실행 (불필요한 빌드 방지)
    paths:
      - "BackEnd/**"
      - "CI_CD/**"
      - ".github/workflows/deploy_backend.yml"

  # GitHub 웹 UI(Actions 탭)에서 사용자가 수동으로 파이프라인을 실행할 수 있도록 허용
  workflow_dispatch:

# 최소 권한의 원칙: 소스 읽기 권한만 부여
permissions:
  contents: read

# 동시성 제어: 동일한 배포 그룹에서 중복 배포가 충돌하지 않도록 순차 실행
concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. 빌드 및 테스트 잡 (Build & Test Job)
  # - 환경: GitHub-hosted 러너 (ubuntu-latest)
  # - 목적: EC2 리소스를 소모하지 않고 클라우드 환경에서 테스트 검증 및 TypeScript 컴파일
  # ----------------------------------------------------------------------------
  build:
    name: Build & Test NestJS
    runs-on: ubuntu-latest

    steps:
      # 1-1. 저장소 소스코드 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

      # 1-2. Node.js 22 런타임 환경 설정 및 npm 의존성 캐싱
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: BackEnd/package-lock.json

      # 1-3. 백엔드 빌드 및 자동 테스트 스크립트 실행 (CI_CD/build_backend.sh)
      - name: Run build and test script
        run: bash CI_CD/build_backend.sh

      # 1-4. 생성된 컴파일 결과물(BackEnd/dist/)을 GitHub 아티팩트로 업로드
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: BackEnd/dist/
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 2. 배포 잡 (Deploy Job)
  # - 환경: 사용자의 EC2 인스턴스 (Self-hosted Linux Runner)
  # - 목적: 빌드 아티팩트를 받아 배포 디렉토리 반영 및 PM2 프로세스 재기동
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: [self-hosted, linux]

    steps:
      # 2-1. 배포 스크립트 실행을 위해 저장소 파일 체크아웃
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      # 2-2. build 잡에서 생성하여 업로드했던 빌드 결과물 아티팩트 다운로드
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: BackEnd/dist

      # 2-3. 실제 EC2 디렉토리 반영 및 PM2 무중단 재기동 스크립트 실행
      - name: Run deploy script
        run: bash CI_CD/deploy_backend.sh
