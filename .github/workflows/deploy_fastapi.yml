# ==============================================================================
# GitHub Actions 워크플로우: FastAPI AI 추론 엔진 EC2 자동 배포 파이프라인
# ==============================================================================
# 동작 구조:
#   1. build 잡: GitHub 호스팅 러너(ubuntu-latest)에서 Python 문법 및 모듈 의존성 검증
#   2. deploy 잡: EC2 Self-hosted 러너에서 Docker Compose fastapi 컨테이너 빌드 및 무중단 재기동
# ==============================================================================

name: Deploy FastAPI to EC2

# 워크플로우 트리거 조건 정의
on:
  # main 브랜치로 push 발생 시 자동 실행
  push:
    branches:
      - main
    # FastAPI 소스, 배포 스크립트, 워크플로우 파일 변경 시에만 실행 (불필요한 빌드 방지)
    paths:
      - "BackEnd/FastAPI/**"
      - "CI_CD/BackEnd/fastapi/**"
      - ".github/workflows/deploy_fastapi.yml"

  # GitHub 웹 UI(Actions 탭)에서 사용자가 수동으로 파이프라인을 실행할 수 있도록 허용
  workflow_dispatch:

# 최소 권한의 원칙: 소스 읽기 권한만 부여
permissions:
  contents: read

# 동시성 제어: 동일한 배포 그룹에서 중복 배포가 충돌하지 않도록 순차 실행
concurrency:
  group: fastapi-production
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. 빌드 및 테스트 잡 (Build & Test Job)
  # - 환경: GitHub-hosted 러너 (ubuntu-latest)
  # - 목적: EC2 리소스를 소모하지 않고 클라우드 환경에서 Python 문법 및 의존성 사전 검증
  # ----------------------------------------------------------------------------
  build:
    name: Build & Verify FastAPI
    runs-on: ubuntu-latest

    steps:
      # 1-1. 저장소 소스코드 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

      # 1-2. Python 3.12 런타임 환경 설정 및 pip 캐싱
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BackEnd/FastAPI/requirements.txt

      # 1-3. FastAPI 빌드 및 문법 검사 스크립트 실행
      - name: Run build script
        run: bash CI_CD/BackEnd/fastapi/build.sh

  # ----------------------------------------------------------------------------
  # 2. 배포 잡 (Deploy Job)
  # - 환경: 사용자의 EC2 인스턴스 (Self-hosted Linux Runner)
  # - 목적: Docker Compose fastapi 컨테이너 빌드 및 무중단 재기동
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: [self-hosted, linux]

    steps:
      # 2-1. 배포 스크립트 실행을 위해 저장소 파일 체크아웃 (기존 .env 등 untracked 파일 보존)
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          clean: false

      # 2-2. 실제 Docker Compose 컨테이너 빌드 및 무중단 배포 스크립트 실행
      - name: Run deploy script
        run: bash CI_CD/BackEnd/fastapi/deploy.sh
