# ==============================================================================
# GitHub Actions 워크플로우: React 프론트엔드 EC2 자동 배포 파이프라인
# ==============================================================================
# 동작 구조:
#   1. build 잡: GitHub 호스팅 러너(ubuntu-latest)에서 소스를 빌드하여 아티팩트 생성
#   2. deploy 잡: EC2 Self-hosted 러너에서 아티팩트를 받아 Nginx 웹 서버 경로로 동기화 배포
# ==============================================================================

name: Deploy React to EC2

# 워크플로우 트리거 조건 정의
on:
  # main 브랜치로 push 발생 시 자동 실행
  push:
    branches:
      - main
    # 프론트엔드 소스, 배포 스크립트, 워크플로우 파일 변경 시에만 실행 (불필요한 빌드 방지)
    paths:
      - "FrontEnd/**"
      - "CI_CD/FrontEnd/**"
      - "CI_CD/BackEnd/nestjs/prepare-env.sh"
      - ".github/workflows/deploy.yml"

  # GitHub 웹 UI(Actions 탭)에서 사용자가 수동으로 파이프라인을 실행할 수 있도록 허용
  workflow_dispatch:

# 워크플로우가 사용하는 최소 권한 부여 (보안 모범 사례: 최소 권한의 원칙)
permissions:
  contents: read # 저장소 코드 읽기 권한만 허용

# 동시성 제어: 동일한 배포 그룹에서 중복 배포가 충돌하지 않도록 제어
concurrency:
  group: frontend-production # 프로덕션 프론트엔드 배포 그룹 식별자
  cancel-in-progress: false   # 새 배포가 들어와도 이전 배포를 취소하지 않고 순차 대기 후 실행

jobs:
  # ----------------------------------------------------------------------------
  # 1. 빌드 잡 (Build Job)
  # - 환경: GitHub-hosted 러너 (ubuntu-latest)
  # - 목적: EC2 리소스(CPU/RAM)를 소모하지 않고 격리된 클라우드 환경에서 안전하게 빌드
  # ----------------------------------------------------------------------------
  build:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      # 1-1. 저장소 소스코드 체크아웃 (v4 최신 액션 사용)
      - name: Checkout source
        uses: actions/checkout@v4

      # 1-2. 빌드에 필요한 Node.js 런타임 환경 설정 및 npm 의존성 캐싱
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm                                      # npm 패키지 캐싱 활성화
          cache-dependency-path: FrontEnd/v1/package-lock.json # 의존성 파일 기준으로 캐시 키 생성

      # 1-3. 프론트엔드 빌드 스크립트 실행 (CI_CD/FrontEnd/build.sh)
      - name: Run build script
        run: bash CI_CD/FrontEnd/build.sh

      # 1-4. 생성된 번들 결과물(FrontEnd/v1/dist/)을 GitHub 아티팩트로 업로드 (다음 deploy 잡에 전달)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist       # 아티팩트 이름
          path: FrontEnd/v1/dist/      # 업로드할 빌드 결과물 경로
          if-no-files-found: error  # 결과물 폴더가 없으면 즉시 에러 처리
          retention-days: 1         # 저장 공간 절약을 위해 보관 기간을 1일로 설정

  # ----------------------------------------------------------------------------
  # 2. 배포 잡 (Deploy Job)
  # - 환경: 사용자의 EC2 인스턴스 (Self-hosted Linux Runner)
  # - 목적: 빌드 아티팩트를 내려받아 로컬 Nginx 웹 루트 디렉토리에 반영
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build                    # build 잡이 성공적으로 끝난 후 실행
    runs-on: [self-hosted, linux]   # EC2에 등록된 Self-hosted Linux 러너 라벨 지정

    steps:
      # 2-1. 배포 스크립트(CI_CD/) 실행을 위해 저장소 파일 체크아웃 (기존 .env 등 untracked 파일 보존)
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          clean: false

      # 2-2. build 잡에서 생성하여 업로드했던 빌드 결과물 아티팩트 다운로드
      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist       # 다운로드할 아티팩트 이름
          path: FrontEnd/v1/dist       # 다운로드하여 압축 해제할 대상 경로

      # 2-3. 실제 Nginx 웹 디렉토리로 파일을 복사하고 검증하는 배포 스크립트 실행
      - name: Run deploy script
        run: bash CI_CD/FrontEnd/deploy.sh
